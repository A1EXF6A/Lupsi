<div class="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-4 font-sans text-gray-800">
  <div class="w-full max-w-sm bg-white rounded-3xl shadow-xl overflow-hidden border border-green-50/50">
    
    <!-- PWA Install Banner (Centralized logic) -->
    <div *ngIf="pwaService.showInstallButton()" class="px-6 pt-6">
      <button (click)="installApp()" class="w-full bg-blue-50 border border-blue-100 text-blue-700 py-3 px-4 rounded-2xl flex items-center justify-center gap-3 hover:bg-blue-100 transition-all font-semibold text-sm">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        Descargar App de LUPSI
      </button>
    </div>
    
    <!-- Header -->
    <div class="px-6 py-10 text-center bg-white">
      <div class="flex justify-center mb-6">
        <div class="w-16 h-16 bg-green-600 rounded-2xl flex items-center justify-center shadow-lg shadow-green-200">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="15" y1="12" y2="12"/><line x1="3" x2="15" y1="12" y2="12"/></svg>
        </div>
      </div>
      <h1 class="text-3xl font-bold text-gray-900 tracking-tight">Bienvenido</h1>
      <p class="text-slate-500 mt-2 font-medium">Ingresa a tu cuenta LUPSI</p>
    </div>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="px-8 pb-10 space-y-6">
      
      <!-- Email -->
      <div class="space-y-2">
        <label class="text-xs font-bold text-slate-400 uppercase tracking-widest px-1">Correo Electrónico</label>
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          </div>
          <input 
            type="email" 
            formControlName="email"
            placeholder="juan.perez@email.com"
            class="w-full pl-11 pr-4 py-3 bg-slate-50 border-transparent rounded-2xl focus:bg-white focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none text-sm placeholder:text-slate-300"
          />
        </div>
        <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="px-2 text-[11px] text-red-500 font-medium">
          Correo inválido
        </div>
      </div>

      <!-- Password -->
      <div class="space-y-2">
        <div class="flex justify-between items-center px-1">
          <label class="text-xs font-bold text-slate-400 uppercase tracking-widest">Contraseña</label>
        </div>
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </div>
          <input 
            type="password" 
            formControlName="password"
            placeholder="Tu contraseña segura"
            class="w-full pl-11 pr-4 py-3 bg-slate-50 border-transparent rounded-2xl focus:bg-white focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none text-sm placeholder:text-slate-300"
          />
        </div>
        <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="px-2 text-[11px] text-red-500 font-medium">
          Mínimo 6 caracteres
        </div>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="bg-red-50 text-red-600 p-3 rounded-2xl text-xs font-medium border border-red-100 flex items-center gap-2 animate-pulse">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12" y1="16" y2="16"/></svg>
        {{ errorMessage }}
      </div>

      <!-- Submit -->
      <button 
        type="submit" 
        [disabled]="isSubmitting"
        class="w-full bg-green-600 hover:bg-green-700 disabled:bg-slate-200 text-white font-bold py-4 rounded-2xl transition-all shadow-lg shadow-green-100 active:scale-[0.98] flex items-center justify-center"
      >
        <span *ngIf="!isSubmitting">Entrar Ahora</span>
        <span *ngIf="isSubmitting" class="flex items-center gap-2">
            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            Verificando...
        </span>
      </button>

      <!-- Footer -->
      <p class="text-center text-slate-400 text-sm font-medium">
        ¿Aún no tienes cuenta? 
        <a routerLink="/register" class="text-green-600 hover:text-green-700 font-bold ml-1">Regístrate gratis</a>
      </p>

    </form>
  </div>
</div>
