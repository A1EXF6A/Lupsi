<div class="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-4 font-sans text-gray-800">
  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden border border-green-50/50">
    
    <!-- PWA Install Banner -->
    <div *ngIf="pwaService.showInstallButton()" class="px-6 pt-6">
      <button (click)="installApp()" class="w-full bg-blue-50 border border-blue-100 text-blue-700 py-3 px-4 rounded-2xl flex items-center justify-center gap-3 hover:bg-blue-100 transition-all font-semibold text-sm">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        Descargar App de LUPSI
      </button>
    </div>

    <!-- Branding & Header Section -->
    <div class="px-6 py-8 text-center bg-white">
      <div class="flex justify-center mb-4">
        <img src="/lupsi_logo-Photoroom.png" alt="LUPSI" class="h-16 w-auto object-contain">
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-slate-800">Crear Cuenta</h1>
      <p class="text-sm text-slate-500 mt-2">LUPSI - Centro Médico Familiar</p>
    </div>

    <!-- Error Alert Box -->
    <div *ngIf="errorMessage" class="mx-6 mb-4 p-4 rounded-xl bg-red-50 border border-red-100 flex items-start">
      <svg class="w-5 h-5 text-red-500 mt-0.5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      <p class="text-sm text-red-700 font-medium">{{ errorMessage }}</p>
    </div>

    <!-- Form Container -->
    <div class="px-6 pb-8 bg-slate-50/50">
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4 mt-2">
        
        <!-- Nombres y Apellidos -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Nombres</label>
            <input type="text" formControlName="first_name" placeholder="Ej. Juan" 
                   [ngClass]="{'border-red-300 ring-1 ring-red-300': f['first_name'].invalid && f['first_name'].touched}"
                   class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all placeholder:text-slate-400">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Apellidos</label>
            <input type="text" formControlName="last_name" placeholder="Ej. Pérez"
                   [ngClass]="{'border-red-300 ring-1 ring-red-300': f['last_name'].invalid && f['last_name'].touched}"
                   class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all placeholder:text-slate-400">
          </div>
        </div>

        <!-- Cédula -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1 flex justify-between">
            Cédula de Identidad
            <span *ngIf="f['dni'].touched && f['dni'].invalid" class="text-red-500 text-xs lowercase normal-case flex items-center">
              *10 dígitos
            </span>
          </label>
          <div class="relative">
            <input type="text" formControlName="dni" placeholder="Ej. 1700000000" maxlength="10"
                   [ngClass]="{'border-red-300 ring-1 ring-red-300 text-red-600': f['dni'].invalid && f['dni'].touched}"
                   class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all placeholder:text-slate-400 font-mono text-base">
            <svg class="w-5 h-5 text-slate-400 absolute left-4 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"></path>
            </svg>
          </div>
        </div>

        <!-- Correo -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Correo Electrónico</label>
          <div class="relative">
            <input type="email" formControlName="email" placeholder="juan.perez@email.com"
                   [ngClass]="{'border-red-300 ring-1 ring-red-300': f['email'].invalid && f['email'].touched}"
                   class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all placeholder:text-slate-400">
            <svg class="w-5 h-5 text-slate-400 absolute left-4 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
            </svg>
          </div>
        </div>

        <!-- Contraseña -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1 mt-2">Contraseña</label>
          <div class="relative">
            <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Tu contraseña segura"
                   [ngClass]="{'border-red-300 ring-1 ring-red-300': f['password'].invalid && f['password'].touched}"
                   class="w-full pl-11 pr-12 py-3 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all placeholder:text-slate-400">
            <svg class="w-5 h-5 text-slate-400 absolute left-4 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
            <button 
              type="button" 
              (click)="togglePasswordVisibility()" 
              class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-green-600 transition-colors focus:outline-none"
              title="Mostrar/Ocultar contraseña"
            >
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="h-2"></div>

        <!-- Action Button -->
        <button type="submit" [disabled]="isSubmitting"
                class="w-full flex justify-center items-center py-3.5 px-4 border border-transparent rounded-xl shadow-lg shadow-green-600/30 text-base font-semibold text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-all active:scale-[0.98] disabled:opacity-70 disabled:cursor-not-allowed">
          <svg *ngIf="isSubmitting" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          {{ isSubmitting ? 'Validando...' : 'Registrarse y Entrar' }}
        </button>

        <!-- Volver a Iniciar Sesión -->
        <div class="pt-4 text-center border-t border-slate-200/50 mt-4">
          <p class="text-sm text-slate-500">
            ¿Ya tienes una cuenta? 
            <a routerLink="/login" class="text-green-600 hover:text-green-700 font-bold ml-1 transition-colors hover:underline">
              Inicia sesión aquí
            </a>
          </p>
        </div>
      </form>
    </div>
  </div>
</div>
